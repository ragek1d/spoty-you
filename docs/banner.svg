<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 480" width="1280" height="480" font-family="Segoe UI, Tahoma, Helvetica, Arial, sans-serif">
  <title>spoty-you: copy Spotify Liked Songs to YouTube Music, made by ragek1d</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e90e0"/>
      <stop offset="0.5" stop-color="#5cc4f5"/>
      <stop offset="1" stop-color="#bdeeff"/>
    </linearGradient>
    <radialGradient id="hill" cx="0.5" cy="1" r="0.75">
