      <stop offset="0.5" stop-color="#3fb92c"/>
      <stop offset="0.51" stop-color="#2a9c1c"/>
      <stop offset="1" stop-color="#5dd044"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1">
