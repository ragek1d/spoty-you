    <circle cx="1150" cy="330" r="96" fill="url(#bubble)" stroke="#ffffff" stroke-opacity="0.6"/>
    <circle cx="1040" cy="70" r="30" fill="url(#bubble)" stroke="#ffffff" stroke-opacity="0.6"/>
    <circle cx="1010" cy="440" r="42" fill="url(#bubble)" stroke="#ffffff" stroke-opacity="0.6"/>
