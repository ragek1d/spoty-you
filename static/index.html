<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>spoty-you</title>
</head>
<body>
  <h1>spoty-you</h1>
  <p id="info">Loading...</p>
  <a href="/login"><button>Login</button></a>
  <button id="fetch">Fetch liked songs</button>
  <button id="start">Start</button>
  <button id="resume">Resume</button>
  <button id="sync">Sync</button>
  <script>
    async function refresh() {
      const data = await (await fetch("/status")).json();
      document.getElementById("info").textContent =
        (data.logged_in ? "Logged in. " : "Not logged in. ") +
        (data.running ? "Running... " : "Idle. ") +
        JSON.stringify(data.counts) +
        (data.error ? " Error: " + data.error : "");
    }
    async function post(url) {
      await fetch(url, { method: "POST" });
      refresh();
    }
    document.getElementById("start").onclick = () => post("/start");
    document.getElementById("resume").onclick = () => post("/start");
    document.getElementById("sync").onclick = () => post("/sync");
    setInterval(refresh, 2000);
    document.getElementById("fetch").onclick = async () => {
      const data = await (await fetch("/fetch", { method: "POST" })).json();
      alert("Total: " + data.total + ", new: " + data.new);
      refresh();
    };
    refresh();
  </script>
</body>
</html>
