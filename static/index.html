<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>spoty-you</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="bubble b1"></div>
  <div class="bubble b2"></div>
  <div class="bubble b3"></div>
  <div class="bubble b4"></div>
  <div class="bubble b5"></div>

  <main class="glass">
    <h1>spoty-you</h1>
    <p class="subtitle">Spotify Liked Songs &rarr; YouTube Music</p>

    <p id="state" class="state">Loading...</p>

    <div class="progress">
      <div id="bar" class="bar"></div>
    </div>
    <p id="percent" class="percent">0%</p>

    <div class="counts">
      <div class="count"><b id="added">0</b><span>Added</span></div>
      <div class="count"><b id="not_found">0</b><span>Not found</span></div>
      <div class="count"><b id="pending">0</b><span>Pending</span></div>
    </div>

    <p id="error" class="error"></p>

    <div class="buttons">
      <a class="button blue" href="/login">Login</a>
      <button id="start" class="button green">Start</button>
      <button id="resume" class="button green">Resume</button>
      <button id="sync" class="button blue">Sync</button>
      <a class="button blue" href="/report">Download report</a>
    </div>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
